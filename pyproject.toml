[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-sorting-research"
version = "0.1.0"
description = "Reproducible experiments with self-sorting arrays"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
examples = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=10", "jupyterlab>=4", "ipykernel>=6"]
legacy = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=10", "scipy>=1.10", "pandas>=2", "seaborn>=0.12", "statsmodels>=0.14", "tabulate>=0.9"]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ruff>=0.9", "build>=1"]

[project.scripts]
cell-sorting = "cell_research.cli:main"

[tool.setuptools.packages.find]
include = ["cell_research*", "modules*"]
exclude = ["*__pycache__*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
