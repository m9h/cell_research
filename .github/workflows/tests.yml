name: Tests and examples
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[examples,dev]'
      - run: ruff check cell_research tests scripts modules/multithread/experiment_utils.py
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
      - if: matrix.python == '3.12'
        run: python scripts/execute_notebooks.py --output outputs/executed-notebooks
        env:
          MPLBACKEND: Agg
